<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>半字 · 设计台</title>
<style>
  :root{
    --bg:#0E1426; --bg2:#131A2E; --toolbar:#151C33; --surface:#1B2440; --surface2:#232C4A;
    --surface3:#2B2545; --line:#2A3556; --strip:#0B1020; --text:#E8ECF8; --muted:#9AA4C4;
    --dim:#6B7699; --cyan:#22D3EE; --purple:#C084FC; --mint:#5EEAD4; --orange:#FF9F43;
    --warn:#FFC857; --ink:#0B1020;
    --candH:42px; --candRadius:14px; --keyRadius:12px; --glassA:.65;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:#070a14;color:#cfd6ec;font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
       font-size:14px;line-height:1.45;overflow-x:hidden}
  button{font-family:inherit}

  /* ---------- 顶栏 ---------- */
  #topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
    background:linear-gradient(180deg,rgba(7,10,20,.98),rgba(7,10,20,.86));
    border-bottom:1px solid #17203334;backdrop-filter:blur(8px)}
  #btnBack{width:34px;height:34px;border-radius:10px;border:1px solid #243055;background:#111a2e;
    color:var(--cyan);font-size:17px;line-height:1;display:none;align-items:center;justify-content:center}
  #btnBack.show{display:flex}
  .titlewrap{flex:1;min-width:0}
  #pageTitle{font-size:16px;font-weight:700;color:#fff;letter-spacing:.01em}
  #pageSub{font-size:11px;color:#5c6788;margin-top:1px}
  #dirtyTag{font-size:11px;padding:4px 9px;border-radius:20px;border:1px solid #243055;color:#5c6788;white-space:nowrap}
  #dirtyTag.dirty{color:#0B1020;background:linear-gradient(135deg,var(--warn),var(--orange));border-color:transparent;font-weight:700}

  main{padding:12px 12px calc(84px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}

  /* ---------- 首页卡片 ---------- */
  .cards{display:flex;flex-direction:column;gap:10px}
  .card{position:relative;display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:16px;
    background:linear-gradient(180deg,#121a2c,#0d1424);border:1px solid #1d2740;text-align:left;color:inherit;
    transition:transform .12s ease, border-color .12s ease}
  .card:active{transform:scale(.985);border-color:#31406b}
  .card .ico{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:18px;background:#18213a;border:1px solid #243055;flex:none}
  .card .txt{flex:1;min-width:0}
  .card .ttl{font-size:15px;font-weight:700;color:#eef2ff}
  .card .sum{font-size:11.5px;color:#7c88ad;margin-top:2px;font-family:ui-monospace,monospace;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .arr{color:#3f4b6e;font-size:16px}

  /* ---------- 迷你实时预览 ---------- */
  .miniWrap{margin:0 0 12px;border-radius:16px;overflow:hidden;border:1px solid #1d2740;background:#05070f}
  .miniHead{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;
    font-size:11px;color:#5c6788;background:#0b1120;border-bottom:1px solid #182136}
  .miniHead b{color:var(--cyan);font-weight:600}
  .dimreadout{font-size:10.5px;color:#6b7896;font-family:ui-monospace,monospace;
    padding:6px 12px 7px;background:#0a1020;border-top:1px solid #141d30;letter-spacing:.01em}
  .dimreadout b{color:#9fb0d8;font-weight:600}
  #sheet .dimreadout{padding:6px 14px;background:transparent;border-top:0;border-bottom:1px solid #16203a}

  /* ---------- 键盘 mock（与输入法同语义） ---------- */
  .mock{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--bg2),var(--bg));padding:0 0 6px}
  .candbar{display:flex;align-items:center;gap:7px;padding:4px 8px;margin:6px 8px 0;
    background:rgba(20,28,48,.92);border:1px solid rgba(255,255,255,.10);
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
  .chip{flex:none;padding:0 13px;height:calc(var(--candH) - 8px);line-height:calc(var(--candH) - 8px);
    border-radius:calc(var(--candRadius) - 4px);color:var(--text);font-size:15px;background:rgba(35,44,74,.55)}
  .chip.first{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));
    border:1px solid rgba(255,255,255,.28);box-shadow:0 2px 8px rgba(0,0,0,.35)}
  .keys{padding:5px 8px 0}
  .krow{display:flex;justify-content:center}
  .k{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,.24);user-select:none;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 1px 2px rgba(0,0,0,.28)}
  .k.tap{cursor:pointer}
  .ripplefx{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.45)}

  /* ---------- 二级页面控件 ---------- */
  .grp{background:#0d1220;border:1px solid #1b2338;border-radius:14px;padding:12px 12px 6px;margin-bottom:12px}
  .grp h2{font-size:11px;margin:0 0 8px;color:var(--cyan);letter-spacing:.12em;text-transform:uppercase}
  .row{display:flex;align-items:center;gap:9px;margin:9px 0;font-size:12.5px;min-height:30px}
  .row>label{flex:1;min-width:0;color:#9fb0d8;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .row label i.key{font-style:normal;font-family:ui-monospace,monospace;font-size:10px;color:#4b5778}
  .row input[type=range]{flex:1;min-width:80px;max-width:150px;accent-color:#22D3EE}
  .row input[type=color]{width:46px;height:30px;border:1px solid #243055;border-radius:8px;background:#0b1120;padding:2px}
  .row select,.row input[type=text],.row input[type=number]{background:#0b1120;color:#cfe3ff;border:1px solid #243055;
    border-radius:8px;padding:6px 8px;font-size:12.5px;min-width:0}
  .row .val{width:44px;text-align:right;color:#63719a;font-family:ui-monospace,monospace;font-size:11.5px;flex:none}
  .hint{color:#5c6788;font-size:11px;margin:6px 0 8px;line-height:1.55}
  .note{border:1px dashed #2a3556;border-radius:10px;padding:9px 11px;color:#7c88ad;font-size:11.5px;margin:8px 0 4px}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
  button.act{background:#16203a;color:#cfe3ff;border:1px solid #2a3556;border-radius:10px;padding:9px 12px;
    font-weight:600;font-size:12.5px}
  button.act.primary{background:linear-gradient(135deg,#22D3EE,#C084FC);color:#08101d;border:none}
  button.act.warn{color:#FFC857;border-color:#4a3d22;background:#1c1810}
  button.act:active{transform:scale(.98)}
  .thin{color:#5c6788;font-size:11px}

  /* ---------- 布局编辑画布 ---------- */
  .pagetabs{display:flex;gap:6px;margin:0 0 10px}
  .pagetabs button{flex:1;padding:9px 0;border-radius:10px;background:#0d1220;border:1px solid #1b2338;
    color:#9fb0d8;font-size:12.5px;font-weight:600}
  .pagetabs button.on{background:linear-gradient(135deg,#22D3EE,#C084FC);border-color:transparent;color:#08101d}
  .edcanvas{background:#0a1020;border:1px solid #1d2740;border-radius:14px;padding:4px;margin-bottom:10px;overflow:hidden}
  .edrow{display:flex;align-items:stretch;gap:0}
  .edhandle{flex:none;width:22px;display:flex;align-items:center;justify-content:center;
    color:#3f4b6e;font-size:12px;letter-spacing:-2px;cursor:grab;touch-action:none}
  .edhandle.grabbing{color:var(--cyan)}
  .edcells{display:flex;flex:1;min-width:0}
  .edcell{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,.22);touch-action:none;user-select:none;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
  .edcell.sel{outline:2px solid var(--cyan);outline-offset:1px;z-index:2}
  .edcell.dragging{opacity:.45}
  .edcell.dropzone{outline:2px dashed var(--warn);outline-offset:1px}
  .edrow.dropzone{outline:2px dashed var(--warn);outline-offset:1px;border-radius:8px}
  .edcell .wtag{position:absolute;right:2px;bottom:0;font-size:8px;color:rgba(255,255,255,.4);
    font-family:ui-monospace,monospace}
  .rowinfo{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:11px;color:#63719a}
  .rowinfo .rh{display:flex;align-items:center;gap:6px;flex:1}
  .rowinfo input[type=range]{flex:1;min-width:60px;max-width:130px;accent-color:#5EEAD4}
  .rowinfo .val{width:40px;text-align:right;color:#63719a;font-family:ui-monospace,monospace;font-size:11px;flex:none}
  .rowinfo .key{font-style:normal;font-family:ui-monospace,monospace;font-size:10px;color:#4b5778}
  .edcell,.edhandle{-webkit-touch-callout:none;-webkit-user-select:none}
  .prop{background:#0d1220;border:1px solid #23406b;border-radius:14px;padding:12px 12px 6px;margin-bottom:12px}
  .prop h2{font-size:11px;color:var(--mint);letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px}
  details{margin:8px 0 0}
  summary{color:#63719a;font-size:11.5px;cursor:pointer;padding:6px 0}
  textarea{width:100%;height:150px;background:#05070f;color:#8fe3c2;border:1px solid #1b2338;border-radius:10px;
    font-family:ui-monospace,monospace;font-size:10.5px;padding:8px;line-height:1.5}

  /* ---------- 二级页编辑器（数字 v9 / 符号 / Emoji，扁平字符） ---------- */
  .altgroups{display:flex;gap:6px;margin-bottom:10px}
  .altgroups button{flex:1;padding:9px 0;border-radius:10px;background:#0d1220;border:1px solid #1b2338;
    color:#9fb0d8;font-weight:600;font-size:12.5px}
  .altgroups button.on{background:linear-gradient(135deg,#22D3EE,#C084FC);color:#08101d;border-color:transparent}
  .altedit{display:grid;grid-template-columns:112px minmax(0,1fr);gap:10px;margin-bottom:12px}
  @media (max-width:430px){ .altedit{grid-template-columns:92px minmax(0,1fr)} }
  .altlist{display:flex;flex-direction:column;gap:6px;background:#0a1020;border:1px solid #1d2740;
    border-radius:12px;padding:8px;max-height:460px;overflow:auto}
  .altlist .altitem{text-align:left;background:#0f1728;border:1px solid #1b2338;border-radius:9px;
    padding:7px 8px;color:#9fb0d8;font-size:11.5px;display:flex;flex-direction:column;gap:2px}
  .altlist .altitem b{font-size:11.5px;font-weight:600;color:#dfe7ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .altlist .altitem span{font-size:9.5px;color:#5c6788;font-family:ui-monospace,monospace}
  .altlist .altitem.on{border-color:#22D3EE;background:#0e2230;box-shadow:0 0 0 1px rgba(34,211,238,.3) inset}
  .altmain{min-width:0}
  .althead{font-size:11.5px;color:#7c88ad;margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
  .althead b{color:#dfe7ff}
  .althead code{font-family:ui-monospace,monospace;color:#4b5778;font-size:10px;text-align:right}
  /* 数字页 v9：左 1 : 中 3 : 右 1（左右纵栏与数字键同宽） */
  .numv9{display:flex;gap:8px;align-items:flex-start}
  .numv9 .sidewrap{flex:1;min-width:0}
  .numv9 .digitedit{flex:3;min-width:0;display:flex;flex-direction:column;gap:4px}
  .numv9 .funcsedit{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .sidegrid{display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:none;
    border-radius:10px;padding:0 1px 0 0}
  .sidegrid::-webkit-scrollbar{display:none}
  .sidegrid .altcell{width:100%;flex:none}
  .digitsrow{display:flex;gap:4px}
  .funcell{height:auto;flex-direction:column;gap:0;line-height:1.05}
  .funcell b{font-size:15px;font-weight:600}
  .funcell small{font-size:8px;color:#4b5778}
  .altgridbox{display:grid;gap:4px}
  .altcell{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;
    border:1px solid rgba(255,255,255,.22);border-radius:12px;cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06);-webkit-user-select:none;user-select:none;
    padding:0 2px;-webkit-touch-callout:none}
  .altcell.empty{background:rgba(255,255,255,.02)!important;border:1px dashed #24304c;color:#3f4b6e;font-size:12px}
  .altcell.sel{outline:2px solid #22D3EE;outline-offset:1px;z-index:2}
  .altcell .kcat{position:absolute;right:2px;bottom:1px;font-size:8px;color:rgba(255,255,255,.35)}
  /* 预览：网格与竖栏可上下滚动 */
  .scrollgrid{overflow-y:auto;overflow-x:hidden}
  .scrollgrid::-webkit-scrollbar{width:3px}
  .scrollgrid::-webkit-scrollbar-thumb{background:#24304c;border-radius:3px}
  .scrollcol{display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .scrollcol::-webkit-scrollbar{display:none;width:0}
  .scrollcol>.altcell{flex:0 0 auto}
  /* 页签栏（仅符号/Emoji）：最左「返回」固定，其余横向滚动 */
  .altrail{display:flex;gap:4px;padding:3px 5px;overflow:hidden;align-items:stretch}
  .altrail .rttab{flex:none;min-width:64px;border-radius:12px;background:transparent;color:#9AA4C4;
    font-size:13px;display:flex;align-items:center;justify-content:center;padding:0 8px;
    border:1px solid transparent;touch-action:none}
  .altrail .rttab.on{background:#232C4A;color:#E8ECF8;border-color:rgba(255,255,255,.14)}
  .altrail .rttab.fixed{min-width:50px;background:#141d33;border:1px solid #243055;color:#9fb0d8;font-size:12px}
  .railscroll{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
  .railscroll::-webkit-scrollbar{display:none}

  /* ---------- 保存条 / FAB / 浮层 ---------- */
  #savebar{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(7,10,20,.2),rgba(7,10,20,.98) 40%)}
  .applybtn{width:100%;max-width:560px;margin:0 auto;display:block;background:linear-gradient(135deg,#5EEAD4,#22D3EE);
    color:#04121A;border:none;border-radius:14px;padding:14px;font-weight:800;font-size:15px;
    box-shadow:0 8px 22px rgba(34,211,238,.22)}
  .applybtn:disabled{opacity:.55}
  #fab{position:fixed;right:14px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:61;width:52px;height:52px;
    border-radius:50%;border:1px solid rgba(255,255,255,.18);font-size:20px;color:#08101d;
    background:linear-gradient(135deg,#22D3EE,#C084FC);box-shadow:0 8px 22px rgba(34,211,238,.35);
    display:none;align-items:center;justify-content:center}
  #fab.show{display:flex}
  #scrim{position:fixed;inset:0;background:rgba(3,6,14,.55);z-index:70;backdrop-filter:blur(2px)}
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;transform:translateY(105%);
    transition:transform .26s cubic-bezier(.22,.9,.28,1);max-height:88vh;display:flex;flex-direction:column;
    background:#0a0f1c;border-top:1px solid #22314f;border-radius:18px 18px 0 0;
    box-shadow:0 -18px 50px rgba(0,0,0,.7);padding-bottom:env(safe-area-inset-bottom)}
  #sheet.open{transform:translateY(0)}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 8px;border-bottom:1px solid #16203a}
  .sheet-head b{font-size:13px;color:#eef2ff}
  .sheet-head button{background:#141d33;border:1px solid #243055;color:#9fb0d8;border-radius:9px;
    width:30px;height:30px;font-size:14px}
  .sheet-body{overflow:auto;padding:0 0 4px}
  .sheet-foot{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #16203a;align-items:center}
  #pvInput{flex:1;min-width:0;background:#05070f;border:1px solid #243055;border-radius:10px;color:#e8ecf8;
    padding:9px 11px;font-size:14px;resize:none;height:42px;line-height:22px}
  .sheet-foot .applybtn{width:auto;padding:11px 14px;font-size:13px;border-radius:11px;margin:0;flex:none}
  .toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);
    background:#182338;border:1px solid #2a3a5e;color:#dff1ff;font-size:12.5px;padding:9px 14px;border-radius:12px;
    opacity:0;transition:.22s;z-index:99;pointer-events:none;max-width:80vw;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  [hidden]{display:none!important}
</style>
</head>
<body>

<header id="topbar">
  <button id="btnBack" aria-label="返回">←</button>
  <div class="titlewrap">
    <div id="pageTitle">设计台</div>
    <div id="pageSub">简易模式</div>
  </div>
  <div id="dirtyTag">已保存</div>
</header>

<main id="view"></main>

<div id="savebar"><button id="btnSave" class="applybtn">保存并应用</button></div>

<button id="fab" title="实机预览">◉</button>

<div id="scrim" hidden></div>
<div id="sheet">
  <div class="sheet-head"><b>实机预览</b><button id="sheetClose">✕</button></div>
  <div class="dimreadout" data-dimread></div>
  <div class="sheet-body"><div id="previewMount"></div></div>
  <div class="sheet-foot">
    <textarea id="pvInput" rows="1" placeholder="点键盘试试上屏…"></textarea>
    <button id="sheetApply" class="applybtn">应用</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
 * 半字设计台 v5 —— 简易模式首页 + 二级编辑页 + 结构化布局编辑器
 * 只有一个出口：ClawTheme.apply(JSON)。字段严格按 design/SCHEMA.md。
 * ========================================================= */

/* ---------------- 令牌默认值（与 Theme.java 对齐） ---------------- */
var COLORS = {
  bg:"#0E1426", bg2:"#131A2E", toolbar:"#151C33", surface:"#1B2440", surface2:"#232C4A",
  surface3:"#2B2545", line:"#2A3556", strip:"#0B1020", text:"#E8ECF8", muted:"#9AA4C4",
  dim:"#6B7699", cyan:"#22D3EE", purple:"#C084FC", mint:"#5EEAD4", orange:"#FF9F43",
  warn:"#FFC857", ink:"#0B1020"
};
var DIMS = { keyH:46, keyGap:4, keyRadius:12, tabH:38, tabW:72, tabRadius:19,
  candH:42, candRadius:14, panelH:92, cardRadius:18, chipH:40, chipRadius:20,
  fontKey:16, fontTab:13, fontSmall:12, fontCand:15, fontPanel:15 };
var FX = { bgBlur:0, bgDim:0, glassAlpha:65, glassBlur:0, animOn:1, animMs:800, glyphMode:0, rippleMode:0 };

var LABELS = {
  bg:"背景", bg2:"背景·深", toolbar:"工具栏底", surface:"按键面", surface2:"功能键面",
  surface3:"胶囊面", line:"描边", strip:"剪贴条底", text:"主文字", muted:"次文字",
  dim:"弱文字", cyan:"主色·青", purple:"次色·紫", mint:"薄荷绿", orange:"橙",
  warn:"警示黄", ink:"墨色",
  keyH:"键高", keyGap:"键间距", keyRadius:"键圆角", tabH:"胶囊高", tabW:"胶囊宽",
  tabRadius:"胶囊圆角", candH:"候选行高", candRadius:"候选圆角", panelH:"卡片高",
  cardRadius:"卡片圆角", chipH:"标注条高", chipRadius:"标注条圆角",
  fontKey:"键字号", fontTab:"胶囊字号", fontSmall:"小字号", fontCand:"候选字号",
  fontPanel:"面板字号"
};

var DIM_RANGE = {
  keyH:[24,80,1], keyGap:[0,20,1], keyRadius:[0,30,1], tabH:[24,60,1], tabW:[48,110,1],
  tabRadius:[6,32,1], candH:[28,64,1], candRadius:[0,30,1], panelH:[56,160,1],
  cardRadius:[0,40,1], chipH:[24,64,1], chipRadius:[0,32,1],
  fontKey:[10,26,1], fontTab:[9,20,1], fontSmall:[8,18,1], fontCand:[10,24,1], fontPanel:[10,24,1]
};
var FX_DEF = [
  ["bgBlur","背景模糊",0,100,1,"bgb"],
  ["bgDim","背景压暗",0,100,1,"bgb"],
  ["glassAlpha","玻璃键不透明度",0,100,1,"lang"],
  ["glassBlur","玻璃键磨砂",0,40,1,"lang"],
  ["animMs","开场时长",300,2000,50,"lang"]
];

/* ---------------- 单元格类型 ---------------- */
var TYPES = [
  ["char","字符"], ["space","空格"], ["del","退格"], ["enter","回车"],
  ["sym","符号页"], ["back","回字母"], ["num","数字页"], ["emoji","表情"],

/* ---------------- 默认布局（严格对齐当前输入法的真实结构） ----------------
 * 数字页：顶部半高标点条 / 左竖栏 + - × ÷（0.85）/ 九宫格 1-9（每格 4.15/3）/
 *         右列 ⌫ 空格 🙂（1.15）/ 底排 ÷ 符号 0 . ⏎（0.85/1.15/1.3/1.1/1.3）
 * 字母页：qwertyuiop / 半键缩进 asdfghjkl / AI+zxcvbnm+⌫ / CN ， 空格 ⚙ ⏎
 * 符号页：4 行 × 10 键 + 底排
 */
function ch(t, w, extra){
  var c = { k:"char", t:t, w:(w==null?1:w) };
  if(extra) for(var x in extra) c[x]=extra[x];
  return c;
}
function fn(k, t, w, color){
  var c = { k:k, w:(w==null?1:w) };
  if(t!=null) c.t=t;
  if(color) c.color=color;
  return c;
}
function punctRow(){
  var s = "。？！…（）“”", cells = [];
  for(var i=0;i<s.length;i++) cells.push(ch(s.charAt(i),1));
  return { h:0.5, cells:cells };
}
var DEFAULT_LAYOUTS = {
  num: { rows:[
    punctRow(),
    { h:1, cells:[ ch("+",0.85), ch("1",1.383), ch("2",1.383), ch("3",1.383), fn("del","⌫",1.15) ] },
    { h:1, cells:[ ch("-",0.85), ch("4",1.383), ch("5",1.383), ch("6",1.383), fn("space","空格",1.15) ] },
    { h:1, cells:[ ch("×",0.85), ch("7",1.383), ch("8",1.383), ch("9",1.383), fn("emoji","🙂",1.15) ] },
    { h:1, cells:[ ch("÷",0.85), fn("sym","符号",1.15), ch("0",1.3), ch(".",1.1), fn("enter","⏎",1.3) ] }
  ]},
  letter: { rows:[
    { h:1, cells:"qwertyuiop".split("").map(function(c){return ch(c,1);}) },
    { h:1, cells:[ fn("gap",null,0.5) ].concat("asdfghjkl".split("").map(function(c){return ch(c,1);}),[ fn("gap",null,0.5) ]) },
    { h:1, cells:[ fn("label","AI",1.5,COLORS.purple) ]
        .concat("zxcvbnm".split("").map(function(c){return ch(c,1);}),[ fn("del","⌫",1.5) ]) },
    { h:1, cells:[ fn("label","CN",1.4), ch("，",1), fn("space","空格",4),
                   fn("label","⚙",1), fn("enter","⏎",1.4) ] }
  ]},
  symbol: { rows:[
    { h:1, cells:"，。、；：？！“”‘’".split("").map(function(c){return ch(c,1);}) },
    { h:1, cells:"（）【】《》…—～·".split("").map(function(c){return ch(c,1);}) },
    { h:1, cells:"￥$€£%‰@#&*".split("").map(function(c){return ch(c,1);}) },
    { h:1, cells:"+-=/\\|<>^_".split("").map(function(c){return ch(c,1);}) },
    { h:1, cells:[ fn("label","CN",1.4), ch("，",1), fn("space","空格",4),
                   fn("label","⚙",1), fn("enter","⏎",1.4) ] }
  ]}
};

/* ---------------- 小工具 ---------------- */
function $(s, root){ return (root||document).querySelector(s); }
function $$(s, root){ return Array.prototype.slice.call((root||document).querySelectorAll(s)); }
function esc(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function rgb(h){
  h = String(h||"#000000").replace("#","");
  if(h.length===3) h = h.split("").map(function(x){return x+x;}).join("");
  return [ parseInt(h.slice(0,2),16)||0, parseInt(h.slice(2,4),16)||0, parseInt(h.slice(4,6),16)||0 ];
}
function rgba(h,a){ var c = rgb(h); return "rgba("+c[0]+","+c[1]+","+c[2]+","+(a==null?1:a)+")"; }
function clamp(v,lo,hi){ return v<lo?lo:(v>hi?hi:v); }
function toast(msg){
  var t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("on"); }, 1600);
}

  else nav.push(Object.assign({ name:name }, extra||{}));

/* =========================================================
 * 渲染：键盘 mock（与输入法同一套语义）
 * ========================================================= */
function cellCss(c, page){
  var isFn = c.k && c.k !== "char" && c.k !== "label";
  var baseHex = isFn ? state.colors.surface2 : state.colors.surface;
  var a = clamp(state.fx.glassAlpha/100 + (isFn?0.12:0), 0, 1);
  var r = (c.r != null) ? c.r : state.dims.keyRadius;
  var col = c.color || (isFn ? state.colors.cyan : state.colors.text);
  if(c.k === "gap") return "flex:"+(c.w||1)+";background:transparent;border:0;box-shadow:none;";
  var fs = c.fs || state.dims.fontKey;
  var blur = state.fx.glassBlur/10;
  return "flex:"+(c.w||1)+";border-radius:"+r+"px;background:"+rgba(baseHex,a)+
    ";color:"+col+";font-size:"+fs+"px;border:1px solid rgba(255,255,255,.24);"+
    (blur>0 ? "backdrop-filter:blur("+blur.toFixed(1)+"px);" : "");
}
function cellText(c){
  if(c.k === "char" || c.k === "label") return c.t || "";
  if(c.t) return c.t;
  var map = { space:"空格", del:"⌫", enter:"⏎", sym:"符号", back:"ABC", num:"123", emoji:"🙂", gap:"" };
  return map[c.k] || "";
}
function candidateBarHtml(){
  var chips = ["我","我们","喔","窝","握"], h = "";
  var inner = Math.max(6, state.dims.keyGap + 3);       // 候选条内边距跟键距走
  var ch = Math.max(16, state.dims.candH - inner * 2);
  var chipR = Math.max(4, state.dims.candRadius - Math.round(inner/2));
  var fs = state.dims.fontCand || 15;
  for(var i=0;i<chips.length;i++)
    h += '<span class="chip'+(i===0?" first":"")+'" style="height:'+ch+'px;line-height:'+ch+'px;'+
      'border-radius:'+chipR+'px;font-size:'+fs+'px">'+esc(chips[i])+'</span>';
  return '<div class="candbar" style="height:'+state.dims.candH+'px;border-radius:'+state.dims.candRadius+
    'px;gap:'+Math.max(4, state.dims.keyGap + 2)+'px;padding:'+inner+'px '+(inner+3)+'px">'+h+'</div>';
}
function kbRowsHtml(page, opts){
  opts = opts || {};
  var keyH = state.dims.keyH;
  var gap = state.dims.keyGap;              // 预览严格跟 Theme.KEYGAP（页面级覆盖不参与绘制）
  var pad = (page.pad != null ? page.pad : 5);
  var h = '<div class="keys" style="padding:'+pad+'px '+(pad+3)+'px 0">';
  page.rows.forEach(function(row, ri){
    var rh = (row.h || 1) * keyH;
    h += '<div class="krow" style="gap:'+gap+'px;margin-bottom:'+gap+'px;height:'+rh+'px">';
    (row.cells||[]).forEach(function(c, ci){
      var cls = "k" + (opts.interactive ? " tap" : "");
      h += '<div class="'+cls+'" data-r="'+ri+'" data-c="'+ci+'" style="'+cellCss(c,page)+'">'+
           esc(cellText(c))+'</div>';
    });
    h += '</div>';
  });
  return h + '</div>';
}
function mockHtml(pageKey, opts){
  opts = opts || {};
  var page = pageOf(pageKey);
  return '<div class="mock">'+candidateBarHtml()+kbRowsHtml(page, opts)+'<div style="height:6px"></div></div>';
}
function refreshMini(){

/* 二级页字号：以 fontKey 为基准按输入法比例推导（默认 16 → 数字24/符号20/emoji22/功能14） */
function altFonts(){
  var k = state.dims.fontKey || 16;
  return {
    digit: Math.max(14, Math.round(k * 1.5)),
    sym:   Math.max(12, Math.round(k * 1.25)),
    emoji: Math.max(13, Math.round(k * 1.35)),
    fn:    Math.max(10, Math.round(k * 0.875)),
    small: Math.max(8, Math.round(state.dims.fontSmall || 12))
  };
}
function fmtNum(n){ return String(Math.round((+n || 0) * 10) / 10); }
function dimReadoutHtml(){

/* =========================================================
 * 涟漪：半径跟随实际按键 bounds（改了宽度/高度也会跟着变）
 * ========================================================= */
function spawnRipple(host, ev){
  if(!host) return;
  var rect = host.getBoundingClientRect();
  var size = Math.max(rect.width, rect.height) * 2.1;
  var span = document.createElement("span");
  span.className = "ripplefx";
  span.style.width = size + "px";
  span.style.height = size + "px";
  var cx = (ev && ev.clientX ? ev.clientX - rect.left : rect.width/2);
  var cy = (ev && ev.clientY ? ev.clientY - rect.top : rect.height/2);
  span.style.left = (cx - size/2) + "px";
  span.style.top = (cy - size/2) + "px";
  span.style.background = rgba(state.colors.cyan, 0.45);
  host.appendChild(span);
  if(span.animate){
    span.animate([{transform:"scale(.15)",opacity:.55},{transform:"scale(1)",opacity:0}],
      {duration:460,easing:"cubic-bezier(.2,.7,.3,1)"}).onfinish = function(){ span.remove(); };
  } else {
    setTimeout(function(){ span.remove(); },460);
  }
}

/* ---- 拖动排序（行：纵向；格子：横向） ---- */
var dragCtx = null;
function onCanvasDown(e){
  var handle = e.target.closest(".edhandle");
  var cell = e.target.closest(".edcell");
  if(!handle && !cell) return;
  var pk = (curRoute().page || "num");
  var page = pageOf(pk);
  var ctx = {
    pk:pk, page:page,
    kind: handle ? "row" : "cell",
    r: parseInt((handle||cell).dataset.r,10),
    c: cell ? parseInt(cell.dataset.c,10) : -1,
    sx: e.clientX, sy: e.clientY,
    armed: false, el: handle ? handle.closest(".edrow") : cell,
    timer: null
  };
  ctx.timer = setTimeout(function(){ ctx.armed = true; if(ctx.el) ctx.el.classList.add("dragging"); }, 140);
  dragCtx = ctx;
  document.addEventListener("pointermove", onCanvasMove, { passive:false });
  document.addEventListener("pointerup", onCanvasUp);
  document.addEventListener("pointercancel", onCanvasUp);
}
function findDropTarget(x, y, kind){
  var el = document.elementFromPoint(x, y);
  if(!el) return null;
  return kind === "row" ? el.closest(".edrow") : el.closest(".edcell");
}
function onCanvasMove(e){
  if(!dragCtx) return;
  var dx = e.clientX - dragCtx.sx, dy = e.clientY - dragCtx.sy;
  if(!dragCtx.armed && Math.abs(dx) + Math.abs(dy) > 10){
    clearTimeout(dragCtx.timer); dragCtx.armed = true;
    if(dragCtx.el) dragCtx.el.classList.add("dragging");
  }
  if(!dragCtx.armed) return;
  e.preventDefault();
  var t = findDropTarget(e.clientX, e.clientY, dragCtx.kind);
  $$(".dropzone").forEach(function(n){ n.classList.remove("dropzone"); });
  if(t && t !== dragCtx.el) t.classList.add("dropzone");
}
function onCanvasUp(e){
  document.removeEventListener("pointermove", onCanvasMove);
  document.removeEventListener("pointerup", onCanvasUp);
  document.removeEventListener("pointercancel", onCanvasUp);
  var ctx = dragCtx; dragCtx = null;
  if(!ctx){ return; }
  clearTimeout(ctx.timer);
  $$(".dropzone").forEach(function(n){ n.classList.remove("dropzone"); });
  if(ctx.el) ctx.el.classList.remove("dragging");
  if(!ctx.armed) return;                    /* 未拖动 → 交给 click 处理选中 */
  var t = findDropTarget(e.clientX, e.clientY, ctx.kind);
  if(!t){ return; }
  var page = ctx.page, from = ctx.r;
  if(ctx.kind === "row"){
    var to = parseInt(t.dataset.r,10);
    if(isNaN(to) || to === from) return;
    var moved = page.rows.splice(from,1)[0];
    page.rows.splice(to,0,moved);
    if(sel) sel = null;
  } else {
    var toRow = parseInt(t.dataset.r,10);
    var toCell = parseInt(t.dataset.c,10);
    if(isNaN(toCell)) return;
    if(toRow !== from){ return; }           /* v1：格子只在行内换位 */
    if(toCell === ctx.c) return;
    var arr = page.rows[from].cells;
    var mv = arr.splice(ctx.c,1)[0];
    arr.splice(toCell,0,mv);
    sel = { r:from, c:toCell };
  }
  markDirty();
  drawCanvas(ctx.pk, true); drawProp(); syncLayJson(ctx.pk);
  toast("已移动（未保存）");
}

function actKey(c, input){
  var v = input.value;
  switch(c.k){
    case "char": v += (c.t||""); break;
    case "space": v += " "; break;
    case "del": v = v.slice(0,-1); break;
    case "enter": v += "\n"; break;
    case "emoji": v += (c.t || "🙂"); break;
    case "sym": if(sheetPage === "symbol") sheetPage = "letter"; else sheetPage = "symbol"; renderSheet(); return;
    case "back": sheetPage = "letter"; renderSheet(); return;
    case "num": sheetPage = "num"; renderSheet(); return;
    default: return;
  }
  input.value = v;
}

/* ---------- 规范化（v9 数字页；兼容旧 grid/side.groups；符号/Emoji 扁平 chars） ---------- */
function altNormTabs(group, defGroup){
  var srcTabs = (group && Array.isArray(group.tabs) && group.tabs.length) ? group.tabs : null;
  if(!srcTabs){
    return defGroup.tabs.map(function(t){ return { id:t.id, label:t.label, chars: t.chars.slice() }; });
  }
  return srcTabs.map(function(t, i){
    var dt = defGroup.tabs[i] || { id:"t" + i, label:"组" + (i + 1), chars: [] };
    var chars;
    if(t && Array.isArray(t.chars)) chars = altChars(t.chars);
    else if(t && Array.isArray(t.pages)) chars = altFlatPages(t.pages);
    else chars = dt.chars.slice();
    return {
      id: (t && t.id) || dt.id,
      label: (t && t.label != null) ? String(t.label) : dt.label,
      chars: chars
    };
  });
}
/** 数字页九宫格：3×3。兼容「扁平 9 个」和旧 num.grid（拍平前 9 格）。 */
function altNormDigits(digits, oldGrid, defDigits){
  var src = digits;
  if(Array.isArray(src) && src.length && !Array.isArray(src[0])){
    var f0 = src.map(altStr);                 // 已是扁平 9 个 → 折成 3×3
    while(f0.length < 9) f0.push("");
    src = [ f0.slice(0,3), f0.slice(3,6), f0.slice(6,9) ];
  }
  if(!Array.isArray(src) || !src.length || !Array.isArray(src[0])){
    if(Array.isArray(oldGrid) && oldGrid.length){
      var flat = [];
      oldGrid.forEach(function(row){ (row || []).forEach(function(v){ flat.push(altStr(v)); }); });
      while(flat.length < 9) flat.push("");
      src = [ flat.slice(0,3), flat.slice(3,6), flat.slice(6,9) ];
    } else src = defDigits;
  }
  var out = [];
  for(var r = 0; r < 3; r++){
    var row = Array.isArray(src[r]) ? src[r] : [];
    var rr = [];
    for(var c = 0; c < 3; c++) rr.push(altStr(row[c]));
    out.push(rr);
  }
  return out;
}
function altNormBottom(bottom, defBottom){
  var src = (Array.isArray(bottom) && bottom.length) ? bottom : defBottom;
  var out = [];
  for(var i = 0; i < 3; i++){
    var v = altStr(src[i]);
    if(/^back$/i.test(v.trim())) v = "back";   // "Back"/"back" 等价
    out.push(v);
  }
  return out;
}
function altNormFuncs(funcs, defFuncs){
  var src = (Array.isArray(funcs) && funcs.length) ? funcs : defFuncs;
  var out = [];
  for(var i = 0; i < 4; i++){
    var v = src[i];
    if(v && typeof v === "object") v = v.k;            // 兼容 {"k":"del","rows":2}
    v = (typeof v === "string") ? v : "empty";
    out.push(FUNC_MAP[v] ? v : "empty");
  }
  return out;
}
function normPages(src){
  var def = DEFAULT_PAGES();
  if(!src || typeof src !== "object") return def;
  function n(v, d, lo, hi){ return (typeof v === "number" && isFinite(v)) ? clamp(v, lo, hi) : d; }
  var R = Math.round(n(src.gridRows, def.gridRows, 2, 8));
  var C = Math.round(n(src.gridCols, def.gridCols, 2, 10));
  var numSrc = (src.num && typeof src.num === "object") ? src.num : {};
  var numSide = altChars(numSrc.side && numSrc.side.chars);
  if(!numSide.length && numSrc.side && Array.isArray(numSrc.side.groups)){
    numSrc.side.groups.forEach(function(g){
      if(Array.isArray(g)) g.forEach(function(v){ numSide.push(altStr(v)); });
    });
  }
  if(!numSide.length) numSide = def.num.side.chars.slice();
  return {
    version: 2,
    gridRows: R, gridCols: C,
    gridRowH: n(src.gridRowH, def.gridRowH, 0.4, 1.4),
    railH: n(src.railH, def.railH, 0.2, 1.2),
    sideCols: 1,
    num: {
      label: (numSrc.label != null) ? String(numSrc.label) : def.num.label,
      side: { chars: numSide },
      digits: altNormDigits(numSrc.digits, numSrc.grid, def.num.digits),
      bottom: altNormBottom(numSrc.bottom, def.num.bottom),
      funcs: altNormFuncs(numSrc.funcs, def.num.funcs)
    },
    sym: { tabs: altNormTabs(src.sym, def.sym) },
    emoji: { tabs: altNormTabs(src.emoji, def.emoji) }
  };
}
function normalizePagesInPlace(){ state.pages = normPages(state.pages); }
function cleanPages(){
  normalizePagesInPlace();
  var p = state.pages, n = p.num;
  return {
    version: 2,
    gridRows: p.gridRows, gridCols: p.gridCols, gridRowH: p.gridRowH, railH: p.railH, sideCols: 1,
    num: JSON.parse(JSON.stringify({
      label: n.label,
      side: { chars: n.side.chars },
      digits: n.digits,
      bottom: n.bottom,
      funcs: n.funcs
    })),
    sym: JSON.parse(JSON.stringify({ tabs: p.sym.tabs })),
    emoji: JSON.parse(JSON.stringify({ tabs: p.emoji.tabs }))
  };
}
function pagesSummary(){
  var sym = state.pages.sym.tabs, em = state.pages.emoji.tabs;
  function count(tabs){ return tabs.reduce(function(a, t){ return a + t.chars.length; }, 0); }
  return {
    numSide: state.pages.num.side.chars.length,
    numDigits: state.pages.num.digits.length * 3,
    numFuncs: state.pages.num.funcs.length,
    symGroups: sym.length, symChars: count(sym),
    emojiGroups: em.length, emojiChars: count(em)
  };
}

/* ---------- 浮层预览里的二级页交互 ---------- */
function bindAltSheet(mount){
  mount.onpointerdown = function(e){
    var k = e.target.closest(".altcell");
    if(k && !k.classList.contains("empty")) spawnRipple(k, e);
  };
  mount.onclick = function(e){
    var rtt = e.target.closest(".rttab");
    if(rtt && rtt.getAttribute("data-rt") != null){
      var rt = rtt.getAttribute("data-rt");
      if(rt === "abc"){ sheetPage = "letter"; renderSheet(); return; }
      if(rt.indexOf("t:") === 0){
        altUI.tab = parseInt(rt.slice(2), 10) || 0;
        altUI.selKind = null; altUI.sel = null;
        renderSheet(); drawAltAll(); return;
      }
      return;
    }
    var k = e.target.closest(".altcell");
    if(!k || k.classList.contains("empty")) return;
    var input = $("#pvInput");
    if(!input) return;
    var act = k.getAttribute("data-act");
    if(act){
      if(act === "del"){ input.value = input.value.slice(0, -1); }
      else if(act === "space"){ input.value += " "; }
      else if(act === "enter"){ input.value += "\n"; }
      else if(act === "emo"){ input.value += "🙂"; }
      else if(act === "back"){ sheetPage = "letter"; renderSheet(); return; }
      else if(act === "calc"){ demoCalc(input); }
      spawnRipple(k, e);
      return;
    }
    var txt = k.getAttribute("data-alt") || "";
    input.value += txt;
    spawnRipple(k, e);
  };
}

/* ---------- 预览用的小算式求值（只服务设计台演示，逻辑对齐 Calc.java 口径） ---------- */
function demoEvaluate(src){
  var s = String(src).replace(/\s+/g, "")
    .replace(/×/g, "*").replace(/÷/g, "/").replace(/−/g, "-").replace(/^=/g, "");
  if(!s || !/[0-9]/.test(s)) return null;
  var i = 0;
  function peek(){ return s.charAt(i); }
  function add(){
    var v = mul();
    while (i < s.length && (peek() === "+" || peek() === "-")) {
      var op = s.charAt(i++); var r = mul();
      v = (op === "+") ? v + r : v - r;
    }
    return v;
  }
  function mul(){
    var v = unary();
    while (i < s.length) {
      var c = peek();
      if (c === "*" || c === "/") { i++; var r = unary(); v = (c === "*") ? v * r : v / r; }
      else if (c === "(") { v = v * unary(); }
      else break;
    }
    return v;
  }
  function unary(){
    if (peek() === "-") { i++; return -unary(); }
    if (peek() === "+") { i++; return unary(); }
    return power();
  }
  function power(){
    var v = postfix();
    if (peek() === "^") { i++; var r = unary(); return Math.pow(v, r); }
    return v;
  }
  function postfix(){
    var v = atom();
    while (peek() === "%") { i++; v = v / 100; }
    return v;
  }
  function atom(){
    if (peek() === "(") { i++; var v = add(); if (peek() !== ")") throw "paren"; i++; return v; }
    var st = i;
    while (i < s.length && /[0-9.]/.test(s.charAt(i))) i++;
    if (st === i) throw "num";
    var n = parseFloat(s.slice(st, i));
    if (!isFinite(n)) throw "num";
    return n;
  }
  try {
    var v = add();
    if (i !== s.length || !isFinite(v)) return null;
    return Math.round(v * 1e10) / 1e10;
  } catch (e) { return null; }
}
function demoCalc(input){
  var val = input.value || "";
  var m = val.match(/[0-9.+\-*/×÷%^−()]+$/);
  if(!m || !m[0]) return;
  var expr = m[0];
  if(!/[0-9]/.test(expr)) return;
  var r = demoEvaluate(expr);
  if(r == null || !isFinite(r)) return;
  input.value = val + "=" + r;
}

/* =========================================================
 * 保存 / 初始化
 * ========================================================= */
function cleanLayouts(){
  var out = {};
  ["num","letter","symbol"].forEach(function(k){
    var p = JSON.parse(JSON.stringify(pageOf(k)));
    out[k] = p;
  });
  return out;
}
function buildJson(){
  var obj = {
    _comment: "半字设计台 v5 · 字段见 design/SCHEMA.md",
    meta: { name:"自定义", updated: new Date().toISOString().slice(0,10) },
    colors: state.colors,
    dims: state.dims,
    fx: state.fx,
    layouts: cleanLayouts(),
    pages: cleanPages()
  };
  return JSON.stringify(obj, null, 2);
}
function save(){
  var json;
  try { json = buildJson(); }
  catch(e){ alert("生成 JSON 失败："+e); return; }
  if(BRIDGE){
    try{
      BRIDGE.apply(json);
      markClean();
      toast("已保存 · 重启输入法生效");
    }catch(e){
      alert("保存失败："+(e && e.message ? e.message : e));
    }
  } else {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([json],{type:"application/json"}));
    a.download = "theme.json"; a.click();
    markClean();
    toast("已导出 theme.json（非 App 环境）");
  }
}
function applyState(obj){
  if(!obj) return;
  if(obj.colors) Object.keys(COLORS).forEach(function(k){ if(obj.colors[k]!=null) state.colors[k]=obj.colors[k]; });
  if(obj.dims) Object.keys(DIMS).forEach(function(k){ if(obj.dims[k]!=null) state.dims[k]=obj.dims[k]; });
  if(obj.fx) Object.keys(FX).forEach(function(k){ if(obj.fx[k]!=null) state.fx[k]=obj.fx[k]; });
  if(obj.layouts){
    ["num","letter","symbol"].forEach(function(k){
      var src = obj.layouts[k];
      if(src && src.rows && src.rows.length){
        state.layouts[k] = {
          pad: (src.pad!=null?src.pad:DEFAULT_LAYOUTS[k].pad),
          gap: (src.gap!=null?src.gap:DEFAULT_LAYOUTS[k].gap),
          radius: (src.radius!=null?src.radius:DEFAULT_LAYOUTS[k].radius),
          rows: JSON.parse(JSON.stringify(src.rows))
        };
      }
    });
  }
  if(obj.pages){
    state.pages = normPages(obj.pages);
    pagesSource = "theme";
  }
  Object.keys(state.colors).forEach(function(k){
    document.documentElement.style.setProperty("--"+k, state.colors[k]);
  });
  document.documentElement.style.setProperty("--candH", state.dims.candH+"px");
  document.documentElement.style.setProperty("--candRadius", state.dims.candRadius+"px");
}

/**
 * 默认二级页数据：theme JSON 里没有 pages 时，尝试取构建期 assets/alt_pages.json。
 * TODO(ime-layout): WebView 打开 file:// 资源时 fetch 可能被拦截（CORS），
 *   失败就保持内置占位；assets 就绪后若仍拉不到，由 DesignActivity 加桥方法 pagesDefault()。
 */
var altDefaultsTried = false;
function maybeLoadAltDefaults(){
  if(altDefaultsTried) return;
  altDefaultsTried = true;
  if(pagesSource === "theme") return;
  try{
    if(!window.fetch) return;
    window.fetch("alt_pages.json").then(function(r){
      return (r && r.ok) ? r.json() : null;
    }).then(function(j){
      if(!j || pagesSource === "theme") return;
      state.pages = normPages(j);
      pagesSource = "assets";
      if(curRoute().name === "pages" || curRoute().name === "home") render();
    }).catch(function(){ /* 静默：用内置占位 */ });
  }catch(e){ /* 静默 */ }
}
</script>
